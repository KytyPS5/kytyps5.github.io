name: Attach game screenshot

# Downloads screenshot(s) from a game-status issue on the KytyPS5 repo into
# public/screenshots/ and attaches them to the compatibility report for the
# game identified by the issue's Game ID / serial, then opens a PR. The report
# must already exist (create it via "Sync compatibility reports" first) —
# screenshots attach to a verified report; this workflow never invents a
# status.
#
# Issues live on KytyPS5/KytyPS5, so this workflow reads them through the
# PUBLIC API (no token — the Actions GITHUB_TOKEN can't read other repos, and
# public reads don't need one). It can't be triggered by comments on that
# repo, so it runs manually: Actions → "Attach game screenshot" → Run workflow
# → type the issue number (image URLs are read from the issue body).
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: KytyPS5 issue number whose body contains the screenshot URLs
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch the issue from KytyPS5/KytyPS5
        id: issue
        run: |
          curl -sf "https://api.github.com/repos/KytyPS5/KytyPS5/issues/${{ inputs.issue_number }}" \
            -o /tmp/kytyps5-issue.json || {
              echo "::error::Issue #${{ inputs.issue_number }} not found on KytyPS5/KytyPS5"
              exit 1
            }
          node - <<'NODE'
          const fs = require("node:fs");
          const issue = JSON.parse(fs.readFileSync("/tmp/kytyps5-issue.json", "utf8"));
          fs.writeFileSync("/tmp/issue-title.txt", issue.title ?? "");
          fs.writeFileSync("/tmp/issue-body.txt", issue.body ?? "");
          NODE

      - name: Collect screenshots and game ID
        id: collect
        run: |
          TITLE="$(cat /tmp/issue-title.txt)"
          BODY="$(cat /tmp/issue-body.txt)"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          # Game ID: the template's "Game ID / serial" field, the legacy
          # "Title ID" field, else the first PPSA-XXXXX in title / body.
          TITLE_ID="$(printf '%s' "$BODY" | awk -v h='### Game ID / serial' '
            $0 == h { f = 1; next }
            f && /^### / { exit }
            f && /^## / { exit }
            f && NF { print; exit }
          ')"
          [ -z "$TITLE_ID" ] && TITLE_ID="$(printf '%s' "$BODY" | awk -v h='### Title ID' '
            $0 == h { f = 1; next }
            f && /^### / { exit }
            f && /^## / { exit }
            f && NF { print; exit }
          ')"
          [ -z "$TITLE_ID" ] && TITLE_ID="$( { printf '%s\n' "$TITLE"; printf '%s' "$BODY"; } | grep -oiE 'PPSA-?[0-9]{5}' | head -1 || true )"
          if [ -z "$TITLE_ID" ]; then
            echo "::error::No Game ID found — file the issue via the Game Emulation Status Report template (or mention the PPSA-XXXXX), then run this workflow again."
            exit 1
          fi
          echo "title_id=$TITLE_ID" >> "$GITHUB_OUTPUT"

          # Image URLs from the issue body's markdown images / bare links.
          # Drop HTML comments first — GitHub inserts <!-- … --> placeholders
          # for failed uploads / notes that can contain URLs. Non-image URLs
          # that slip through (e.g. uploaded log files) are skipped by
          # attach-screenshot.mjs rather than failing the run.
          BODY_CLEAN="$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//sg')"
          URLS="$(printf '%s' "$BODY_CLEAN" | grep -oE 'https?://[^[:space:]>]+' || true)"
          URLS="$(printf '%s\n' "$URLS" | sed 's/[),.;]*$//' | grep -v '^$' || true)"
          if [ -z "$URLS" ]; then
            echo "::error::No image URL found in the issue body — add the screenshot links to the issue and re-run."
            exit 1
          fi
          printf '%s\n' "$URLS" > /tmp/image-urls.txt
          echo "url_count=$(wc -l < /tmp/image-urls.txt)" >> "$GITHUB_OUTPUT"

      - name: Attach screenshots to the report
        run: |
          TITLE="${{ steps.collect.outputs.title }}"
          TITLE_ID="${{ steps.collect.outputs.title_id }}"
          ARGS=(--title-id "$TITLE_ID" --title "$TITLE")
          while IFS= read -r URL; do
            [ -n "$URL" ] && ARGS+=(--image "$URL")
          done < /tmp/image-urls.txt
          node scripts/attach-screenshot.mjs "${ARGS[@]}"
          node scripts/validate-compat.mjs

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: screenshots for KytyPS5 issue #${{ inputs.issue_number }}"
          branch: screenshots/issue-${{ inputs.issue_number }}
          title: "data: screenshots for KytyPS5 issue #${{ inputs.issue_number }}"
          delete-branch: true
