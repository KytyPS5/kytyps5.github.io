name: Refresh games database

# Refresh the PS5 title list from the PlayStation-Titles dataset weekly and
# enrich a batch of concepts with PlayStation Store metadata. Manual runs can
# tune the enrich count.
#
# Changes open a PR (data/games-refresh) instead of pushing to main directly:
# CI gates the diff, a bad import can't break main, and auto-merge merges the
# PR once CI passes. Re-runs update the standing PR in place, so there is at
# most one open refresh PR at any time. Auto-merge requires branch protection
# on main with CI / test as a required status check (see README → Automation).
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      enrich:
        description: "Number of concepts to enrich"
        default: "300"

permissions:
  contents: write # push the PR branch
  pull-requests: write # open the PR + enable auto-merge

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import games
        env:
          ENRICH: ${{ github.event.inputs.enrich || '300' }}
        run: |
          [[ "$ENRICH" =~ ^[0-9]+$ ]] || { echo "enrich must be a number"; exit 1; }
          node scripts/import-games.mjs --enrich "$ENRICH"
      - name: Open refresh PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Only the games database is ever touched by the import script.
          add-paths: src/data/games.json
          commit-message: "data: refresh games database"
          branch: data/games-refresh
          title: "data: refresh games database"
          delete-branch: true

      - name: Enable auto-merge
        # No PR when the database didn't change (create-pull-request exits
        # cleanly without output) — nothing to merge in that case.
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
          delete-branch: true
