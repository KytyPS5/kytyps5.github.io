name: Sync compatibility reports

# Game-status issues live on the KytyPS5 repo (Game Emulation Status Report
# template, kytyps5-game-emulation.yaml). GitHub Actions can't react to another
# repo's events, so this workflow POLLS the KytyPS5 issues API instead of
# mirroring issues here — there is exactly one copy of every issue.
#
# Every 30 minutes it converts any open "[GAME STATUS]" issue that doesn't
# already have a site report into src/content/compat/*.md and opens a PR via
# create-pull-request (which keeps the PR updated in place, so re-runs only
# add new reports). Already-converted issues are skipped via the report's own
# `> Source:` line — no extra state. Maintainer verification happens at PR
# review: the merged PR is the gate, exactly as before.
#
# Manual runs: Actions → "Sync compatibility reports" → Run workflow → type a
# KytyPS5 issue number. An explicit number always converts (or re-converts,
# overwriting the game's report) — use it after you verified an issue and the
# report should reflect its current status.
#
# Issues that can't be converted (e.g. Game ID / serial answered "Unknown")
# fail loudly in the log and are retried on the next poll, so fixing the issue
# upstream is enough — no manual cleanup.
on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (may be delayed under load)
  workflow_dispatch:
    inputs:
      issue_number:
        description: Convert a specific KytyPS5 issue (re-runs overwrite that game's report)
        required: false
        type: string

# create-pull-request pushes a branch + opens the PR, so the token needs
# write access to both. Required on repos whose default token is read-only.
permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch unconverted game-status issues
        id: fetch
        run: |
          ARGS=(--repo KytyPS5/KytyPS5 --output /tmp/status-issues.json)
          if [ -n "${{ inputs.issue_number }}" ]; then
            ARGS+=(--issue-number "${{ inputs.issue_number }}")
          fi
          node scripts/fetch-status-issues.mjs "${ARGS[@]}"
          COUNT="$(node -e 'const a = require("/tmp/status-issues.json"); console.log(a.length)')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT game-status issue(s) to convert."

      - name: Convert issues to reports
        if: steps.fetch.outputs.count != '0'
        run: |
          node - <<'NODE'
          const issues = require("/tmp/status-issues.json");
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          let ok = 0, failed = 0;
          for (const issue of issues) {
            const bodyFile = `/tmp/issue-${issue.number}-body.txt`;
            fs.writeFileSync(bodyFile, issue.body ?? "");
            const args = [
              "scripts/issue-to-compat.mjs",
              "--issue-body-file", bodyFile,
              "--date", String(issue.created_at).slice(0, 10),
              "--source", `KytyPS5 issue #${issue.number}`,
              "--source-url", `https://github.com/KytyPS5/KytyPS5/issues/${issue.number}`,
            ];
            try {
              execFileSync("node", args, { stdio: "inherit" });
              ok++;
            } catch {
              failed++;
              console.error(
                `::warning::issue #${issue.number} could not be converted — fix it on KytyPS5/KytyPS5 ` +
                `(e.g. fill in a real PPSA title ID instead of "Unknown") and the next poll will retry.`,
              );
            }
          }
          console.log(`Converted ${ok} issue(s), ${failed} failed.`);
          NODE

      - name: Open or update the report PR
        if: steps.fetch.outputs.count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "compat: sync reports from KytyPS5 game-status issues"
          branch: compat/status-reports
          title: "compat: sync reports from KytyPS5 game-status issues"
          delete-branch: true
