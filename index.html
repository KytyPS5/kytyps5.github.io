<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0070d1" />
    <script>
      (() => {
        const route = new URLSearchParams(location.search).get("__kyty_path");
        if (location.pathname === "/" && route) {
          try {
            const target = new URL(route, location.origin);
            if (route.startsWith("/") && target.origin === location.origin)
              history.replaceState(
                null,
                "",
                target.pathname + target.search + target.hash,
              );
          } catch {
            /* Invalid redirect input leaves the visitor at home. */
          }
        }
        let theme;
        try {
          theme = localStorage.getItem("kyty-theme");
        } catch {}
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <meta
      name="description"
      content="KytyPS5 is a free, open-source PlayStation 5 emulator for Windows, Linux and macOS. Download a build, explore compatibility and help move emulation forward."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://kytyps5.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KytyPS5 — Beyond the console" />
    <meta
      property="og:description"
      content="Open-source PlayStation 5 emulator for Windows, Linux and macOS."
    />
    <meta property="og:url" content="https://kytyps5.github.io/" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/KytyPS5/KytyPS5/main/docs/screenshots/ps5-01.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KytyPS5 — Beyond the console" />
    <meta
      name="twitter:description"
      content="Open-source PlayStation 5 emulator for Windows, Linux and macOS."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/KytyPS5/KytyPS5/main/docs/screenshots/ps5-01.png"
    />
    <script id="seo-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "KytyPS5",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows 10+, Linux, macOS (Apple Silicon via Rosetta 2)",
        "description": "Open-source PlayStation 5 emulator for Windows, Linux and macOS.",
        "license": "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html",
        "url": "https://github.com/KytyPS5/KytyPS5",
        "codeRepository": "https://github.com/KytyPS5/KytyPS5",
        "isAccessibleForFree": true
      }
    </script>
    <style>
      /* Present before JavaScript arrives; shared with React's loading states. */
      .kitty-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 200px;
        color: var(--color-text-secondary, #486080);
        font-family: var(--font-body, "Public Sans Variable", sans-serif);
        font-size: 16px;
        line-height: 1.65;
        font-weight: 400;
      }
      .kitty-loader.route-empty {
        min-height: 65vh;
      }
      #root > .kitty-loader {
        min-height: 100svh;
      }
      .kitty-loader-art {
        display: block;
        width: 104px;
        aspect-ratio: 5 / 4;
        /* Tint both animated and reduced-motion artwork without changing frames. */
        filter: brightness(0) saturate(100%) invert(31%) sepia(100%) saturate(1969%) hue-rotate(187deg) brightness(87%) contrast(107%);
      }
      .kitty-loader-art img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .kitty-loader-art--compact {
        width: 28px;
      }
      .release-refresh {
        width: 42px;
        height: 37px;
      }
      :root[data-theme="dark"] .kitty-loader-art {
        filter: brightness(0) saturate(100%) invert(85%) sepia(19%) saturate(811%) hue-rotate(181deg) brightness(102%) contrast(101%);
      }
      :root[data-theme="dark"] #root > .kitty-loader {
        background: #080f20;
        color: #b8cae8;
      }
      body:has(#root > .kitty-loader) {
        margin: 0;
        background: #f5f7fc;
      }
    </style>
    <title>KytyPS5 — Beyond the console</title>
  </head>
  <body>
    <div id="root">
      <div class="kitty-loader" role="status">
        <picture class="kitty-loader-art" aria-hidden="true">
          <source
            media="(prefers-reduced-motion: reduce)"
            srcset="/images/kitty-still-v2.png"
          />
          <img
            src="/images/kitty-running-v2.gif"
            width="240"
            height="192"
            alt=""
          />
        </picture>
        <span>Loading KytyPS5…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
