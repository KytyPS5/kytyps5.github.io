<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // GitHub Pages deep-link support: /KytyPS5-site/<route> 404s, so 404.html
      // stores the requested path here and bounces to the base. Restore it now
      // so BrowserRouter renders the right route on refresh / direct links.
      (function () {
        var redirect = sessionStorage.getItem("kytyps5-redirect");
        if (redirect && redirect !== location.pathname + location.search) {
          sessionStorage.removeItem("kytyps5-redirect");
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <title>KytyPS5 — Open-Source PlayStation 5 Emulator</title>
    <meta
      name="description"
      content="KytyPS5 is a free and open-source PlayStation 5 emulator written in C++ for Windows, Linux and macOS, with an experimental macOS build. Download the latest build or build from source."
    />
    <meta name="theme-color" content="#05060B" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="KytyPS5 contributors" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://distantmyth.github.io/KytyPS5-site/" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KytyPS5" />
    <meta property="og:title" content="KytyPS5 — Open-Source PlayStation 5 Emulator" />
    <meta
      property="og:description"
      content="A free and open-source PlayStation 5 emulator for Windows, Linux and macOS. Early development, focused on compatibility and boot reliability."
    />
    <meta property="og:url" content="https://distantmyth.github.io/KytyPS5-site/" />
    <meta property="og:image" content="https://raw.githubusercontent.com/KytyPS5/KytyPS5/main/docs/screenshots/ps5-01.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KytyPS5 — Open-Source PlayStation 5 Emulator" />
    <meta
      name="twitter:description"
      content="A free and open-source PlayStation 5 emulator for Windows, Linux and macOS."
    />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/KytyPS5/KytyPS5/main/docs/screenshots/ps5-01.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "KytyPS5",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows 10+, Linux, macOS (Apple Silicon via Rosetta 2)",
        "description": "Free and open-source PlayStation 5 emulator for Windows, Linux and macOS.",
        "license": "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html",
        "url": "https://github.com/KytyPS5/KytyPS5",
        "codeRepository": "https://github.com/KytyPS5/KytyPS5",
        "softwareVersion": "Early development",
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
